<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Ivan's Video</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
	<!-- ?t= busts GitHub Pages caching; the import map does the same for core.js, which store.js imports -->
	<script>
		const t = "?t=" + Date.now();
		document.write(`<script type="importmap">{"imports":{"./assets/js/core.js":"./assets/js/core.js${t}"}}<\/script>
			<link rel="stylesheet" href="assets/css/store.css${t}" />
			<script type="module" src="assets/js/store.js${t}"><\/script>`);
	</script>
</head>
<body>
	<header>
		<div class="logo"><b>Ivan's</b> Video</div>
		<nav id="tabs"></nav>
		<input id="search" type="search" placeholder="Search titles" />
		<a id="swap" data-swap href="classic.html">Classic view</a>
	</header>

	<div id="aisles"></div>

	<div id="bar">
		<button id="drawer-btn" data-do="drawer">Filters</button>
		<div id="drawer"></div>
	</div>

	<div id="active"></div>
	<p id="count">Loading...</p>
	<main><ul id="grid"></ul></main>

	<dialog id="popup"></dialog>
</body>
</html>
